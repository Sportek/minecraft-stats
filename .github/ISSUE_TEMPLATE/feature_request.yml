name: Idée ou amélioration
description: Proposer une fonctionnalité ou une amélioration.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Le besoin
      description: Quel problème ça résout, pour qui ?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Ce que tu proposes
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives envisagées
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: Je veux bien m'en occuper (voir CONTRIBUTING.md)

name: Deploy

# Un seul workflow pour toute la stack. Les anciens `deploy-backend.yml` et
# `deploy-mcp.yml` filtraient sur `backend/**` et `mcp/**` : un push qui ne
# touchait que `frontend/**` ne déclenchait donc aucun déploiement, et le front
# ne partait en prod que quand un changement backend passait dans le même push.
# Ici le job `deploy` tourne sur *tous* les pushes de `main`/`staging` ; seuls
# les builds d'images sont filtrés, parce qu'eux sont coûteux et qu'un build
# sauté ne fait rien rater (Dokploy retire simplement l'image inchangée).

on:
  push:
    branches:
      - main
      - staging

permissions:
  contents: read

# Deux pushes rapprochés déclenchaient deux `compose.deploy` concurrents sur la
# même stack. On sérialise par branche, sans annuler : un déploiement en cours
# doit aller au bout plutôt que de laisser la stack à moitié à jour.
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  changes:
    name: Detect changed workspaces
    runs-on: ubuntu-latest

    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      mcp: ${{ steps.filter.outputs.mcp }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Filter paths
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/deploy.yml'
            mcp:
              - 'mcp/**'
              - '.github/workflows/deploy.yml'

  build-backend:
    name: Build and push backend image
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: sportek/minecraft-stats-back

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set image tag
        id: set-tag
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "tag=latest" >> $GITHUB_OUTPUT
          else
            echo "tag=staging" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.set-tag.outputs.tag }}
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-mcp:
    name: Build and push MCP image
    needs: changes
    if: needs.changes.outputs.mcp == 'true'
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: sportek/minecraft-stats-mcp

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set image tag
        id: set-tag
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "tag=latest" >> $GITHUB_OUTPUT
          else
            echo "tag=staging" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./mcp
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.set-tag.outputs.tag }}
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Dokploy
    needs: [changes, build-backend, build-mcp]
    # Les deux builds sont conditionnels : `success()` (le défaut) sauterait le
    # déploiement dès que l'un des deux est `skipped`, c'est-à-dire sur tout push
    # frontend-only — exactement le bug qu'on corrige. On exige seulement qu'aucun
    # build *lancé* n'ait échoué. `changes`, lui, doit avoir réussi : s'il casse,
    # les builds sont sautés à tort et on déploierait une image périmée.
    if: >-
      !cancelled()
      && needs.changes.result == 'success'
      && needs.build-backend.result != 'failure'
      && needs.build-backend.result != 'cancelled'
      && needs.build-mcp.result != 'failure'
      && needs.build-mcp.result != 'cancelled'
    runs-on: ubuntu-latest
    # `main` -> compose de prod, `staging` -> compose de staging. Le `composeId`
    # vit dans les variables d'environnement GitHub, pas dans le workflow.
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}

    steps:
      - name: Trigger Dokploy deployment
        env:
          DOKPLOY_API_TOKEN: ${{ secrets.DOKPLOY_API_TOKEN }}
          DOKPLOY_COMPOSE_ID: ${{ vars.DOKPLOY_COMPOSE_ID }}
        run: |
          set -euo pipefail

          # Sans ce garde-fou, une variable d'environnement absente enverrait
          # `{"composeId": ""}` et le job resterait vert sans rien déployer.
          if [ -z "${DOKPLOY_COMPOSE_ID}" ]; then
            echo "::error::DOKPLOY_COMPOSE_ID is not set for environment '${{ github.ref_name == 'main' && 'production' || 'staging' }}'."
            exit 1
          fi

          payload=$(printf '{"composeId":"%s"}' "${DOKPLOY_COMPOSE_ID}")

          # `--fail-with-body` renvoie le corps de la réponse même en erreur ;
          # `--fail` seul masquait le message d'erreur de Dokploy.
          curl -sS -X POST "https://dokploy.gablandry.com/api/compose.deploy" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            -H "x-api-key: ${DOKPLOY_API_TOKEN}" \
            -d "${payload}" \
            --fail-with-body

          echo
          echo "Deployment queued for compose ${DOKPLOY_COMPOSE_ID}."
          echo "::notice::Dokploy a accepté la demande. L'API répond dès la mise en file : vérifier les logs Dokploy pour confirmer que le build a réussi."

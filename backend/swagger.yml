      operationId: "getGlobalStats"
      parameters:
        - in: "query"
          name: "fromDate"
          description: "Start of range as epoch milliseconds (or the literal string `now`). Omit it to go back to the platform's first recorded day."
          schema:
            example: "1716854400000"
            type: "number"
          required: false
        - in: "query"
          name: "toDate"
          description: "End of range as epoch milliseconds (or the literal string `now`). Defaults to now."
          schema:
            example: "1717459200000"
            type: "number"
          required: false
        - in: "query"
          name: "interval"
          description: "Bucket size for aggregation. Allowed values: `30 minutes`, `1 hour`, `2 hours`, `6 hours`, `1 day`, `1 week` (URL-encode the space, e.g. `interval=1%20hour`). A range/interval pair producing more buckets than your tier allows is rejected."
          schema:
            example: "1 hour"
            type: "string"
          required: false
        - in: "query"
          name: "categoryId"
          description: "Restrict aggregation to servers in this category."
          schema:
            example: "3"
            type: "number"
          required: false
        - in: "query"
          name: "languageId"
          description: "Restrict aggregation to servers in this language."
          schema:
            example: "1"
            type: "number"
          required: false
      tags:
        - "STATS"
      responses:
        200:
          content:
            application/json:
              schema:
                type: "array"
                items:
                  type: "object"
              example:
                - createdAt: "2026-05-28T12:00:00.000Z"
                  playerCount: 48230
                  peakPlayerCount: 71400
                  minPlayerCount: 29800
                  maxCount: 120000
          description: "Returns **200** (OK) as **application/json**"
        400:
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  errors:
                    type: "object"
                    properties:
                      0:
                        type: "object"
                        properties:
                          message: "This range would produce 26280 points (limit is 1500) — request a wider interval"
                          code: "E_TIER_LIMIT"
                  limit: "statBuckets"
                  allowed: 1500
                  requested: 26280
                  tier: "guest"
                  unlockedBy: "login"
              example:
                errors:
                  - message: "This range would produce 26280 points (limit is 1500) — request a wider interval"
                    code: "E_TIER_LIMIT"
                limit: "statBuckets"
                allowed: 1500
                requested: 26280
                tier: "guest"
                unlockedBy: "login"
          description: "Returns **400** (Bad Request) as **application/json**"
        410:
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  message: "This server has chosen not to be listed on Minecraft Stats."
                  hidden: true
              example:
                message: "This server has chosen not to be listed on Minecraft Stats."
                hidden: true
          description: "Returns **410** (Gone) as **application/json**"
        500:
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  error: "Internal server error"
              example:
                error: "Internal server error"
          description: "Returns **500** (Internal Server Error) as **application/json**"
      security: []

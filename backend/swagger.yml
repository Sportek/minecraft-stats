      description: "Sends a password reset link to the account matching the given email, when one exists. To prevent account enumeration the endpoint always returns the same 200 response whether or not an account was found. A reset link is only sent for verified, non-OAuth accounts; the emailed token is high-entropy and only its hash is stored server-side, expiring after 1 hour.\n\n _app/controllers/auth_controller.ts_ - **forgotPassword**"

  /api/v1/servers/{serverId}/vote:
    post:
      summary: "Vote for a server (store)"
      description: "Registers an anonymous vote for a server. The voter only supplies a Minecraft username; no account is required. Accepting the terms (`acceptedTerms: true`) is mandatory and also grants tracking consent. A voter may vote once per server every 90 minutes (enforced across the tracked visitor, the hashed IP and the username). When enabled, a Cloudflare Turnstile token is verified. The vote is linked to the tracked visitor, and to the logged-in account when authenticated. The Minecraft username is enriched best-effort via Mojang (UUID + self-hosted head). Publicly accessible.\n\n _app/controllers/server_votes_controller.ts_ - **store**"
      operationId: "voteForServer"
      parameters:
        - in: "path"
          name: "serverId"
          description: "Server id"
          schema:
            example: "42"
            type: "number"
          required: true
      tags:
        - "SERVERS"
      responses:
        200:
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  voteCount: 128
                  monthlyVoteCount: 12
                  nextVoteAt: "2026-07-04T13:30:00.000Z"
                  player:
                    type: "object"
                    properties:
                      username: "Notch"
                      uuid: "069a79f444e94726a5befca90e38aaf5"
                      headPath: "/images/heads/069a79f444e94726a5befca90e38aaf5"
              example:
                voteCount: 128
                monthlyVoteCount: 12
                nextVoteAt: "2026-07-04T13:30:00.000Z"
                player:
                  username: "Notch"
                  uuid: "069a79f444e94726a5befca90e38aaf5"
                  headPath: "/images/heads/069a79f444e94726a5befca90e38aaf5"
          description: "Returns **200** (OK) as **application/json**"
        400:
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  message: "You must accept the terms of use to vote."
              example:
                message: "You must accept the terms of use to vote."
          description: "Returns **400** (Bad Request) as **application/json**"
        404:
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  message: "Server not found"
              example:
                message: "Server not found"
          description: "Returns **404** (Not Found) as **application/json**"
        422:
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  errors:
                    type: "object"
                    properties:
                      0:
                        type: "object"
                        properties:
                          message: "The username field format is invalid"
                          field: "username"
                          rule: "regex"
              example:
                errors:
                  - message: "The username field format is invalid"
                    field: "username"
                    rule: "regex"

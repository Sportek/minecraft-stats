  /api/v1/servers/{server_id}/stats:
    get:
      summary: "Get stats for a single server (index)"
      description: "Returns **200** (OK) as **application/json**\n\n _app/controllers/stats_controller.ts_ - **index**"
      operationId: "getServerStats"
      parameters:
        - in: "path"
          name: "server_id"
          description: "Server id"
          schema:
            example: "125"
            type: "number"
          required: true
        - in: "query"
          name: "exactTime"
          description: "Point-in-time lookup as epoch milliseconds (or the literal string `now`). Returns the row at that timestamp, or an averaged interpolation between the nearest before/after rows."
          schema:
            example: "1717200000000"
            type: "number"
          required: false
        - in: "query"
          name: "fromDate"
          description: "Start of range as epoch milliseconds (or the literal string `now`). Omit it alongside `interval` to go back to the server's first recorded day. Required if neither interval nor exactTime is provided."
          schema:
            example: "1716854400000"
            type: "number"
          required: false
        - in: "query"
          name: "toDate"
          description: "End of range as epoch milliseconds (or the literal string `now`). Defaults to now."
          schema:
            example: "1717459200000"
            type: "number"
          required: false
        - in: "query"
          name: "interval"
          description: "Bucket size for aggregation. When provided, stats are grouped per bucket. Allowed values: `30 minutes`, `1 hour`, `2 hours`, `6 hours`, `1 day`, `1 week` (URL-encode the space, e.g. `interval=1%20hour`). A range/interval pair producing more buckets than your tier allows is rejected."
          schema:
            example: "1 hour"
            type: "string"
          required: false
      tags:
        - "STATS"
      responses:
        200:
          content:
            application/json:
              schema:
                type: "array"
                items:
                  type: "object"
              example:
                - serverId: 134
                  createdAt: "2026-05-28T12:00:00.000Z"
                  playerCount: 1250
                  peakPlayerCount: 1840
                  minPlayerCount: 910
                  maxCount: 2000
          description: "Returns **200** (OK) as **application/json**"
        400:
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  errors:
                    type: "object"
                    properties:
                      0:
                        type: "object"
                        properties:
                          message: "This range would produce 26280 points (limit is 1500) — request a wider interval"
                          code: "E_TIER_LIMIT"
                  limit: "statBuckets"
                  allowed: 1500
                  requested: 26280
                  tier: "guest"
                  unlockedBy: "login"
              example:
                errors:
                  - message: "This range would produce 26280 points (limit is 1500) — request a wider interval"
                    code: "E_TIER_LIMIT"
                limit: "statBuckets"
                allowed: 1500
                requested: 26280
                tier: "guest"
                unlockedBy: "login"
          description: "Returns **400** (Bad Request) as **application/json**"
        500:
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  error: "Internal server error"
              example:
                error: "Internal server error"
          description: "Returns **500** (Internal Server Error) as **application/json**"
      security: []

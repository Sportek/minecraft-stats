name: minecraft-stats
services:
  ##########################################################################
  # Backend
  ##########################################################################
  adonis_app:
    container_name: "stats-backend-${APP_NAME}"
    image: "sportek/minecraft-stats-back:${IMAGE_TAG:-latest}"
    pull_policy: always
    restart: "unless-stopped"
    command: >
      sh -c "node ace migration:run --force && node ace serve"
    environment:
      - NODE_ENV=${NODE_ENV}
      - PORT=${PORT}
      - APP_KEY=${APP_KEY}
      - HOST=${HOST}
      - LOG_LEVEL=${LOG_LEVEL}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_DATABASE=${DB_DATABASE}
      - DB_PASSWORD=${DB_PASSWORD}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID}
      - DISCORD_CLIENT_SECRET=${DISCORD_CLIENT_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - LIMITER_STORE=${LIMITER_STORE}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - APP_NAME=${APP_NAME}
      - WEBSITE_URL=${WEBSITE_URL}
      - DRIVE_DISK=${DRIVE_DISK}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
      - S3_BUCKET=${S3_BUCKET}
      - S3_CDN_URL=${S3_CDN_URL}
      - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY}
      - METRICS_TOKEN=${METRICS_TOKEN}
    networks:
      - sail
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - server-images:/home/node/app/public/images

  ##########################################################################
  # Scheduler
  ##########################################################################
  adonis_scheduler:
    container_name: "stats-scheduler-${APP_NAME}"
    image: "sportek/minecraft-stats-back:${IMAGE_TAG:-latest}"
    pull_policy: always
    restart: "unless-stopped"
    depends_on:
      - adonis_app
    command: "node ace scheduler:run"
    environment:
      - NODE_ENV=${NODE_ENV}
      - PORT=${PORT}
      - APP_KEY=${APP_KEY}
      - HOST=${HOST}
      - LOG_LEVEL=${LOG_LEVEL}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_DATABASE=${DB_DATABASE}
      - DB_PASSWORD=${DB_PASSWORD}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID}
      - DISCORD_CLIENT_SECRET=${DISCORD_CLIENT_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - LIMITER_STORE=${LIMITER_STORE}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - APP_NAME=${APP_NAME}
      - WEBSITE_URL=${WEBSITE_URL}
      - DRIVE_DISK=${DRIVE_DISK}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
      - S3_BUCKET=${S3_BUCKET}
      - S3_CDN_URL=${S3_CDN_URL}
      - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY}
    networks:
      - sail
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - server-images:/home/node/app/public/images
    healthcheck:
      test: ["CMD", "pgrep", "node"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  ##########################################################################
  # Frontend (Next.js)
  ##########################################################################
  # Les variables NEXT_PUBLIC_* sont figées dans le bundle client au moment du
  # build (voir frontend/Dockerfile) : celles listées ici ne servent qu'au rendu
  # côté serveur. Changer une URL d'API demande donc un rebuild de l'image, pas
  # seulement un redéploiement.
  frontend:
    container_name: "stats-frontend-${APP_NAME}"
    image: "sportek/minecraft-stats-front:${IMAGE_TAG:-latest}"
    pull_policy: always
    restart: "unless-stopped"
    depends_on:
      - adonis_app
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - NEXT_PUBLIC_BACKEND_URL=${NEXT_PUBLIC_BACKEND_URL}
      - NEXT_PUBLIC_BASE_URL=${NEXT_PUBLIC_BASE_URL:-}
      - NEXT_PUBLIC_ASSETS_URL=${NEXT_PUBLIC_ASSETS_URL}
      - NEXT_PUBLIC_TURNSTILE_SITE_KEY=${NEXT_PUBLIC_TURNSTILE_SITE_KEY}
      - NEXT_PUBLIC_GOOGLE_TAG_MANAGER=${NEXT_PUBLIC_GOOGLE_TAG_MANAGER}
      - NEXT_PUBLIC_MICROSOFT_CLARITY=${NEXT_PUBLIC_MICROSOFT_CLARITY}
    networks:
      - sail
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      # 127.0.0.1 et non localhost : le serveur Next écoute en IPv4 (0.0.0.0),
      # alors que localhost résout en IPv6 (::1) dans l'image Alpine.
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  ##########################################################################
  # Serveur MCP (Model Context Protocol) — expose les stats publiques aux IA
  ##########################################################################
  mcp:
    container_name: "stats-mcp-${APP_NAME}"
    image: "sportek/minecraft-stats-mcp:${IMAGE_TAG:-latest}"
    pull_policy: always
    restart: "unless-stopped"
    depends_on:
      - adonis_app
    environment:
      - NODE_ENV=${NODE_ENV}
      - PORT=3334
      - HOST=0.0.0.0
      # Le MCP récupère le spec OpenAPI et relaie les requêtes vers le backend
      # via le réseau interne, en utilisant le port d'écoute du backend (${PORT}).
      - API_BASE_URL=http://adonis_app:${PORT}
      - MCP_PATH=/mcp
      - ALLOWED_HOSTS=${MCP_ALLOWED_HOSTS:-}
      - ALLOWED_ORIGINS=${MCP_ALLOWED_ORIGINS:-}
    networks:
      - sail
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      # 127.0.0.1 (et non localhost) : le serveur écoute en IPv4 (0.0.0.0), alors
      # que localhost résout en IPv6 (::1) dans l'image Alpine -> connexion refusée.
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:3334/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  ##########################################################################
  # Redis
  ##########################################################################
  redis:
    image: redis:7.4.1-alpine
    container_name: "redis-${APP_NAME}"
    restart: "unless-stopped"
    # Commande pour activer l'append-only et définir un mot de passe
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--requirepass",
        "${REDIS_PASSWORD}",
      ]
    environment:
      # Par exemple, pour distinguer la config
      REDIS_REPLICATION_MODE: standalone
    networks:
      - sail
    volumes:
      - redis-data:/data
    healthcheck:
      # Vérifie si Redis répond à la commande 'PING'
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  sail:
    external: true
    name: dokploy-network

volumes:
  sailpgsql:
    name: "stats-pgsql-${APP_NAME}"
  server-images:
    name: "stats-images-${APP_NAME}"
    driver: local
  redis-data:
    name: "redis-data-${APP_NAME}"
